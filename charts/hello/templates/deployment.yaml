apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: web
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.port }}
          {{- if .Values.useEsoSecret }}
          env:
            - name: HELLO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hello-credentials
                  key: password
          {{- end }}
