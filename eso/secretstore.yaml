# Fake provider: serves hardcoded values, no cloud account needed.
# Swap for a GCP Secret Manager provider later if you want the real thing.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: eugen-playground-store
spec:
  provider:
    fake:
      data:
        - key: hello-password
          value: s3cret-from-eso
