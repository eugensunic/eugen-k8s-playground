kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: eugen-playground
nodes:
  - role: control-plane
    # Publish the node's 80/443 to the Mac's localhost, so an ingress
    # controller is reachable at http://localhost without port-forward.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
